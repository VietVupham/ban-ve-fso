<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<title>Tra cứu bản vẽ & BPTC – Five Star Odyssey</title>
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1c2428;--mute:#66737a;--line:#dfe3e0;--acc:#0f4c5c;--acc2:#e36414;--accbg:#e3eef1;--hl:#ffe08a;--r:10px}
@media(prefers-color-scheme:dark){:root{--bg:#12181b;--card:#1b2327;--ink:#e8edef;--mute:#94a3a9;--line:#2b373c;--acc:#5fb3c6;--acc2:#ff9a52;--accbg:#1f3139;--hl:#6b5a14}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
@media(prefers-color-scheme:dark){header{background:#0b2c35}}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.brand b{font-size:16px}.brand span{font-size:12px;opacity:.8}
.sb{display:flex;gap:8px}
.sb input{flex:1;min-width:0;border:0;border-radius:var(--r);padding:11px 12px;font:inherit;background:#fff;color:#1c2428}
.sb button{border:0;border-radius:var(--r);padding:0 14px;background:var(--acc2);color:#fff;font-weight:600}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x proximity;overscroll-behavior-x:contain;touch-action:pan-x}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;white-space:nowrap;scroll-snap-align:start;border:0;padding:9px 14px;border-radius:var(--r);background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.tab[aria-selected=true]{background:#fff;color:var(--acc)}
@media(prefers-color-scheme:dark){.tab[aria-selected=true]{background:#e8edef;color:#0b2c35}}
main{max-width:980px;margin:0 auto;padding:12px 12px calc(40px + env(safe-area-inset-bottom))}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
@media(prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#0b2c35}}
.chip small{opacity:.7;margin-left:4px}
.lbl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:10px 2px 4px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.grp>h3{margin:0;padding:10px 12px;font-size:14.5px;background:var(--accbg);display:flex;justify-content:space-between;gap:8px}
.grp>h3 small{font-weight:400;color:var(--mute);white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:6px 10px;font-size:13.5px;line-height:1.3}
.grp.shop>h3{cursor:pointer;user-select:none;padding:8px 10px}
.grp.shop>h3::before{content:'▸';margin-right:6px;color:var(--mute)}
.grp.shop.open>h3::before{content:'▾'}
.grp.shop:not(.open)>:not(h3){display:none}
.sub{padding:3px 10px!important;font-size:11.5px!important}
.row:hover{background:var(--accbg)}

.sub{padding:8px 12px 2px;font-size:12px;color:var(--acc);font-weight:700;border-top:1px solid var(--line)}
.doc{display:flex;gap:12px;align-items:flex-start}

.empty{padding:30px 10px;text-align:center;color:var(--mute)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.res .snip{font-size:13px;color:var(--mute);margin-top:2px;overflow-wrap:anywhere}
.upn2{font-size:11px;color:#9a5b00;font-weight:600}.oplan{display:block;width:100%;text-align:left;border:0;border-radius:10px;background:#0b2c35;color:#fff;font-weight:700;font-size:14.5px;padding:13px 12px;margin:8px 0}.oplan small{font-weight:400;opacity:.8}.ordb{padding:6px 12px 12px}.ot{width:100%;border-collapse:collapse;font-size:13.5px;margin:4px 0}.ot td{padding:5px 6px;border-top:1px solid var(--line)}.ot td:last-child{text-align:right;white-space:nowrap}.ot tr.tot td{font-weight:700;background:var(--accbg)}.ot tr.sub td:first-child{padding-left:20px;color:var(--mute)}.ot tr.hd td{font-size:12px;color:var(--mute);font-weight:600;border-top:0}.omem>summary{cursor:pointer;font-weight:700;margin:10px 0 6px}.oq{width:100%;box-sizing:border-box;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;margin:4px 0 8px}.om>summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:7px 4px;border-top:1px solid var(--line);font-size:13.5px}.om>summary span{color:var(--mute);font-size:12.5px;white-space:nowrap}
.stb{font-size:11px;background:#fff1d6;color:#9a5b00;border-radius:5px;padding:0 6px;margin-left:6px;font-weight:700}.row.old{opacity:.62}.oldb{color:#b45309;font-weight:600}.newb{color:#15803d;font-weight:600}.grp>.sub{padding:6px 12px;font-size:12.5px;color:var(--mute)}
.src{display:inline-block;font-size:11px;border-radius:5px;padding:0 6px;margin-right:6px;background:var(--accbg);color:var(--acc);font-weight:700}

/* viewer */

.hr{display:flex;gap:8px;align-items:stretch}.hr .sb{flex:1;min-width:0}
#mn{flex:none;width:44px;border:0;border-radius:var(--r);background:rgba(255,255,255,.16);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:0}
#mn i{display:block;width:20px;height:2.5px;border-radius:2px;background:#fff}
#drb{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
#dr{position:fixed;top:0;bottom:0;left:0;width:min(84vw,330px);background:var(--card);color:var(--fg,inherit);z-index:61;transform:translateX(-102%);transition:transform .27s ease;box-shadow:4px 0 24px rgba(0,0,0,.35);padding-bottom:20px;overflow:auto}
body.dro #dr{transform:none}body.dro #drb{opacity:1;pointer-events:auto}
#dr .dh{background:var(--acc);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 16px}#dr .dh b{display:block;font-size:17px}#dr .dh span{font-size:12px;opacity:.8}
.di{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;padding:14px 16px;font:inherit}
.di .ic{font-size:22px}.di b{display:block;font-size:15.5px}.di small{color:var(--mute);font-size:12.5px}.di[aria-current=true]{background:var(--accbg)}
.seg{display:flex;gap:0;margin:2px 0 10px;border:1px solid var(--acc);border-radius:10px;overflow:hidden}
.seg .chip{flex:1;border:0;border-radius:0;background:var(--card);padding:10px 6px;font-weight:600;text-align:center}.seg .chip[aria-pressed=true]{background:var(--acc);color:#fff}
.dlb{display:flex;justify-content:flex-end;padding:6px 10px;border-bottom:1px solid var(--line)}
.dlb button,.dlbtn{border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:8px;font-weight:600;font-size:13px;padding:6px 10px}
#vdl{flex:none;border:0;border-radius:8px;background:#e2f2fc;color:#0b2c35;font-weight:700;font-size:13px;padding:9px 11px}
body.dept .tabs,body.dept #sf{display:none}body.dept .hr{margin-bottom:0}.soon{text-align:center;padding:60px 20px;color:var(--mute)}.soon .ic{font-size:48px}.soon h2{color:var(--fg,inherit);margin:10px 0 6px}
</style>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- chuẩn hoá để tìm không dấu, giữ nguyên độ dài ---------- */
const nc={};
function normChar(c){
  if(c in nc) return nc[c];
  let r=c.toLowerCase();
  if(r==='đ') r='d'; else if(r==='∅'||r==='⌀') r='ø';
  else { const d=r.normalize('NFD'); r=d.length&&d[0]!=='̸'?d[0]:r; }
  return nc[c]=r;
}
function norm(s){ let o=''; for(const ch of s) o+= ch.charCodeAt(0)<128 ? (ch>='A'&&ch<='Z'?ch.toLowerCase():ch) : normChar(ch).slice(0,ch.length); return o; }
function normQ(q){ return norm(q).replace(/(?:\bphi|\bfi|\bf)\s*(?=\d)/g,'ø').replace(/\s+/g,' ').trim(); }

let ORD=[],SHOP=[],BP={docs:[],pages:[]},DS={docs:[],pages:[],byKey:{}},state={open:new Set(),oopen:new Set(),tab:'shop',ver:'t',bver:'t',dept:'sb',zone:'Tất cả',cat:'Tất cả',bcat:'Tất cả',dkind:'Tất cả',dlatest:'0',q:''};
const ZONES=['Tất cả','Zone 1','Zone 2','Zone 3','Chung'];
const SCATS=['Tất cả','Cột - Vách','Dầm','Sàn','Bể nước PCCC','Capping beam'];

async function load(){
  await syncCheck(false);
  const [a,b]=await Promise.all([fetch('data/shop.json',{cache:'no-cache'}).then(r=>r.json()),fetch('data/bptc.json',{cache:'no-cache'}).then(r=>r.json())]);
  SHOP=a; BP=b;
  try{ORD=await fetch('data/order.json',{cache:'no-cache'}).then(r=>r.ok?r.json():[]);}catch(e){ORD=[]}
  try{DS=await fetch('data/design.json',{cache:'no-cache'}).then(r=>r.ok?r.json():{docs:[],pages:[]});}catch(e){DS={docs:[],pages:[]}}
  DS.byKey={}; DS.docs.forEach(d=>{DS.byKey[d.key]=d;d.no=d.key.slice(0,6)}); DS.pages.forEach(p=>{p.src='d';p.n=norm((p.dw||'')+' '+p.t+' '+p.kind+' '+p.x);p.nt=norm((p.dw||'')+' '+p.t+' '+p.kind)});
  if(DS.docs.length){const nw=[...DS.docs].sort((a,b)=>b.date.localeCompare(a.date))[0];state.open.add('d'+nw.key);}
  SHOP.forEach(p=>{p.n=norm(p.title+' '+p.kind+' '+p.cum+' '+p.txt);p.nt=norm(p.title+' '+p.kind)});
  BP.pages.forEach(p=>{p.n=norm(p.t||'')});
  const byKey={}; BP.docs.forEach(d=>{byKey[d.key]=d;d.np=0;d.nn=norm(d.title+' '+d.no+' '+d.cat+' '+d.file)}); BP.pages.forEach(p=>{byKey[p.k].np++});
  BP.byKey=byKey;
  route();
}
/* ---------- trình xem ---------- */
const V={tok:0,list:[],i:0,mode:'scroll',z:1,sc:1,x:0,y:0,iw:0,ih:0,fit:1,q:'',io:null};
const CH={}, BLOB={}; let VER={h:{}};
/* ảnh trang được gói theo cụm (.bin): shop 8 trang/gói, BPTC 12 trang/gói */
function chunkOf(p){ if(p.src==='o') return {g:'o'+p.id,n:p.p,c:0}; if(p.src==='d') return {g:'d'+p.k,n:p.p,c:Math.floor((p.p-1)/8)}; return p.src==='b' ? {g:'b'+p.k,n:p.p,c:Math.floor((p.p-1)/12)} : {g:'s'+p.doc,n:p.page,c:Math.floor((p.page-1)/8)}; }
function loadChunk(id){
  if(!CH[id]) CH[id]=fetch(`data/c/${id}.txt?h=${(VER.h||{})[id]||''}`).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer();}).then(buf=>{
    const dv=new DataView(buf),n=dv.getUint32(0,true); let off=4+n*6; const m={};
    for(let k=0;k<n;k++){const pg=dv.getUint16(4+k*6,true),len=dv.getUint32(6+k*6,true);m[pg]=new Blob([buf.slice(off,off+len)],{type:'image/webp'});off+=len;}
    return m;}).catch(e=>{delete CH[id];throw e;});
  return CH[id];
}
async function imgUrl(p){
  const {g,n,c}=chunkOf(p), key=g+'_'+n; if(BLOB[key]) return BLOB[key];
  const m=await loadChunk(g+'_'+c); if(!m[n]) throw new Error('thiếu trang');
  return BLOB[key]=URL.createObjectURL(m[n]);
}
const pageNo=p=>(p.src==='b'||p.src==='d'||p.src==='o')?p.p:p.page;
function meta(p){
  if(p.src==='o'){const o=ORD.find(x=>x.id===p.id);return {title:`${o.code} – Mặt bằng theo dõi đặt hàng`,sub:`${o.title} · ${o.date.split('-').reverse().join('/')}`,total:o.np};}
  if(p.src==='d'){const d=DS.byKey[p.k];return {title:`${d.no} · ${(p.dw?p.dw+' – ':'')+p.t}`,sub:`${d.title} · ${p.rev?'Rev '+p.rev+' · ':''}trang ${p.p}`,total:d.np};}

function snippet(raw,toks){

  while((m=re.exec(ns))){ out+=esc(sn.slice(last,m.index))+'<mark>'+esc(sn.slice(m.index,m.index+m[0].length))+'</mark>'; last=m.index+m[0].length; if(!m[0].length)re.lastIndex++; }
  out+=esc(sn.slice(last)); return (s>0?'…':'')+out+(e<raw.length?'…':'');

let RES=[];
function search(q){
  const nq=normQ(q); const toks=nq.split(' ').filter(Boolean); if(!toks.length) return {toks,res:[]};
  const res=[];
  const score=(n,nt)=>{ let s=0; for(const t of toks){ const i=n.indexOf(t); if(i<0) return 0; s+=1+Math.min(5,n.split(t).length-1)*.2; if(nt&&nt.includes(t)) s+=6; } return s; };
  SHOP.forEach(p=>{ const s=score(p.n,p.nt); if(s) res.push({src:'s',p,s,raw:p.title+' | '+p.txt}); });
  BP.pages.forEach(p=>{ const d=BP.byKey[p.k]; const s=score(p.n+' '+d.nn,d.nn); if(s) res.push({src:'b',p:Object.assign({src:'b'},p),s,raw:p.t||'',d}); });
  DS.pages.forEach(p=>{ const s=score(p.n,p.nt); if(s) res.push({src:'d',p,s:s*(p.lt?1:.9),raw:p.t+' | '+p.x}); });
  res.sort((a,b)=>b.s-a.s); return {toks,res};
}
function renderSearch(){
  const {toks,res}=search(state.q); RES=res;
  if(!toks.length) return '<div class="empty">Nhập từ khoá để tìm trong toàn bộ bản vẽ và biện pháp.</div>';
  const nS=res.filter(r=>r.src==='s').length,nD=res.filter(r=>r.src==='d').length,nB=res.length-nS-nD;
  let h=`<div class="note"><b>${res.length}</b> trang khớp “${esc(state.q)}” — ${nS} trang shop drawing, ${nB} trang BPTC, ${nD} trang bản vẽ thiết kế. Bấm để mở đúng trang.</div>`;
  if(!res.length) return h+'<div class="empty">Không thấy. Thử từ ngắn hơn hoặc bỏ dấu (ví dụ “mach ngung”, “HB4”, “C7F”).</div>';
  h+='<section class="grp res">'+res.slice(0,80).map((r,i)=>{
    const t=r.src==='s'?r.p.title:r.src==='d'?`${DS.byKey[r.p.k].no} · ${(r.p.dw?r.p.dw+' – ':'')+r.p.t} (tr.${r.p.p})`:`MOS.${r.d.no} – ${r.d.title} (tr.${r.p.p})`;
    const where=r.src==='s'?`${r.p.cum} · STR.${r.p.dn} · tr.${r.p.page}`:r.src==='d'?`${DS.byKey[r.p.k].title}${r.p.lt?'':' · đã có bản mới hơn'}`:`${r.d.cat} · ${r.d.date.split('-').reverse().join('/')}`;
    return `<button class="row" data-res="${i}"><span class="t"><div><span class="src">${r.src==='s'?(r.p.ver==='d'?'SHOP · DUYỆT':'SHOP · THỰC HIỆN'):r.src==='d'?'THIẾT KẾ':'BPTC'}</span>${esc(t)}</div><div class="k">${esc(where)}</div><div class="snip">${snippet(r.raw,toks)}</div></span></button>`;
  }).join('')+'</section>';
  if(res.length>80) h+=`<div class="note">Hiển thị 80 kết quả đầu. Thêm từ khoá để thu hẹp.</div>`;
  return h;
}

  else if((m=h.match(/^o-(\d+)-(\d+)$/))){ const o=ORD.find(x=>x.id===m[1]); if(o&&o.np){ const list=[]; for(let i=1;i<=o.np;i++)list.push({src:'o',id:o.id,p:i}); state.tab='order';render();openViewer(list,Math.min(+m[2],o.np)-1);} }
  else if((m=h.match(/^d-([0-9a-z]+)-(\d+)$/))){ const list=DS.pages.filter(p=>p.k===m[1]).sort((a,b)=>a.p-b.p); const i=list.findIndex(p=>p.p===+m[2]); if(i>=0){state.tab='design';render();openViewer(list,i);} }
  else if((m=h.match(/^b-([0-9a-f]{10})-(\d+)$/))){ const list=BP.pages.filter(p=>p.k===m[1]).map(p=>Object.assign({src:'b'},p)).sort((a,b)=>a.p-b.p); const i=list.findIndex(p=>p.p===+m[2]); if(i>=0){state.tab='bptc';state.bver=BP.byKey[m[1]].st?'t':'d';render();openViewer(list,i);} }
}

/* ---------- tải PDF (dựng từ ảnh các trang, chạy trên máy) ---------- */
function dlDoc(t,k){
  let list,name;
  if(t==='s'){list=SHOP.filter(p=>p.doc===k);const p0=list[0];name=`STR.${p0.dn}${p0.ver==='d'?'-duyet':'-thuc-hien'} ${p0.cum}`;}
  else if(t==='b'){const d=BP.byKey[k];list=BP.pages.filter(p=>p.k===k).map(p=>Object.assign({src:'b'},p)).sort((a,b)=>a.p-b.p);name=(d.no?'MOS.'+d.no+' ':'')+d.title;}
  else {const d=DS.byKey[k];list=DS.pages.filter(p=>p.k===k).sort((a,b)=>a.p-b.p);name=d.no+' '+d.title;}
  makePDF(list,name);
}
let PDFBUSY=false;
async function makePDF(list,name){
  if(PDFBUSY){toast('Đang tạo PDF, vui lòng chờ…');return;} PDFBUSY=true;
  try{
    const enc=new TextEncoder(),parts=[],xr=[];let off=0;
    const put=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);off+=u.length;};
    put('%PDF-1.4\n%\xe2\xe3\xcf\xd3\n');
    const n=list.length, pageIds=list.map((_,i)=>3+i*3);
    const obj=(id,body)=>{xr[id]=off;put(`${id} 0 obj\n`);put(body);put('\nendobj\n');};
    xr[1]=off;put('1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n');
    // trang được ghi tuần tự: Pages (obj 2) ghi ở cuối
    for(let i=0;i<n;i++){
      toast(`Đang tạo PDF… ${i+1}/${n}`);
      const url=await imgUrl(list[i]); const blob=await fetch(url).then(r=>r.blob());
      const bm=await createImageBitmap(blob); const cv=document.createElement('canvas'); cv.width=bm.width;cv.height=bm.height;
      const cx=cv.getContext('2d'); cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(bm,0,0); if(bm.close)bm.close();
      const jb=await new Promise(r=>cv.toBlob(r,'image/jpeg',.86)); const ju=new Uint8Array(await jb.arrayBuffer()); const w=cv.width,h=cv.height; cv.width=cv.height=1;
      const pw=(w*.3).toFixed(1),ph=(h*.3).toFixed(1),id=3+i*3;
      xr[id]=off;put(`${id} 0 obj\n<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${ju.length}>>\nstream\n`);put(ju);put('\nendstream\nendobj\n');
      const ct=`q ${pw} 0 0 ${ph} 0 0 cm /I Do Q`;
      obj(id+1,`<</Length ${ct.length}>>\nstream\n${ct}\nendstream`);
      obj(id+2,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</I ${id} 0 R>>>>/Contents ${id+1} 0 R>>`);
    }
    obj(2,`<</Type/Pages/Count ${n}/Kids[${pageIds.map(i=>(i+2)+' 0 R').join(' ')}]>>`);
    const total=3+n*3,xo=off; let x=`xref\n0 ${total}\n0000000000 65535 f \n`;
    for(let i=1;i<total;i++)x+=String(xr[i]).padStart(10,'0')+' 00000 n \n';
    put(x+`trailer\n<</Size ${total}/Root 1 0 R>>\nstartxref\n${xo}\n%%EOF`);
    const fn=name.replace(/[\\/:*?"<>|]+/g,' ').trim().slice(0,90)+'.pdf';
    const bl=new Blob(parts,{type:'application/pdf'}), f=new File([bl],fn,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[f]})&&/iPhone|iPad|Android/.test(navigator.userAgent)){try{await navigator.share({files:[f],title:fn});toast('Đã tạo PDF');PDFBUSY=false;return;}catch(e){if(e&&e.name==='AbortError'){PDFBUSY=false;return;}}}
    const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
    toast('Đã tạo PDF: '+fn);
  }catch(e){toast('Không tạo được PDF: '+(e.message||e));}
  PDFBUSY=false;
}

async function syncCheck(manual){
  const b=$('#synb'); if(manual){b.disabled=true;b.textContent='Đang đồng bộ…';}
  try{
    const v=await fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json();});
    const first=!VER.updated; const changed=!first&&v.updated!==VER.updated;
    const hchg=!first&&JSON.stringify(v.h)!==JSON.stringify(VER.h);
    VER=v; $('#synt').textContent='Dữ liệu cập nhật: '+fmtT(v.updated);
    try{localStorage.setItem('bv_ver',v.updated);}catch(e){}
    if(navigator.serviceWorker&&navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({keep:Object.keys(v.h).map(k=>`data/c/${k}.txt?h=${v.h[k]}`)});
    if(changed||hchg){ toast('Có bản vẽ mới – đang cập nhật…'); setTimeout(()=>location.reload(),900); }
    else if(manual) toast('Đã là bản mới nhất');
  }catch(e){ $('#synt').textContent=VER.updated?('Dữ liệu cập nhật: '+fmtT(VER.updated)+' (offline)'):'Không có mạng'; if(manual)toast('Không kết nối được, thử lại sau'); }
  if(manual){b.disabled=false;b.textContent='⟳ Đồng bộ';}
}
